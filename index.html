<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物件 G 擺放位置抽籤</title>
<style>
  body { font-family: "Noto Serif TC", "PMingLiU", serif; margin: 0; padding: 24px; background: #fff; color: #111; }
  h1 { text-align: center; font-weight: normal; letter-spacing: 6px; margin: 0 0 12px; }
  #instruction { text-align: center; font-size: 18px; margin-bottom: 16px; min-height: 28px; }
  #instruction b { font-weight: bold; }
  .wrap { max-width: 900px; margin: 0 auto; }
  canvas { width: 100%; height: auto; display: block; background: #ccc; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 16px 0; }
  #result { font-size: 24px; }
  #result b { font-size: 28px; }
  button { font-size: 18px; padding: 10px 28px; cursor: pointer; border: 2px solid #000; background: #fff; border-radius: 6px; }
  button:hover { background: #eee; }
  #history { margin-top: 12px; font-size: 15px; }
  #history li { margin: 2px 0; }
  .cfg { font-size: 14px; color: #555; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>物件 G 擺放位置</h1>
  <canvas id="board" width="1040" height="720"></canvas>
  <div class="controls">
    <button id="drawBtn">抽取</button>
    <span id="result"></span>
  </div>
</div>

<script>
// ===== 可調整參數 =====
const X_MAX = 22;          // X 抽取範圍 0 ~ 22
const Y_MAX = 14;          // Y 抽取範圍 0 ~ 14
const BOARD_W = 26;        // 板子格數 (X)
const BOARD_H = 18;        // 板子格數 (Y)
const OBJ_SIZE = 3.5;      // 物件 G 邊長（以格為單位，依實物調整）
const DIRS = ["+X", "-X", "+Y", "-Y"];
// ======================

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const PAD_L = 60, PAD_R = 60, PAD_T = 50, PAD_B = 60;
const cell = Math.min(
  (canvas.width - PAD_L - PAD_R) / BOARD_W,
  (canvas.height - PAD_T - PAD_B) / BOARD_H
);
const ox = PAD_L + ((canvas.width - PAD_L - PAD_R) - cell * BOARD_W) / 2; // 原點像素 x
const oy = canvas.height - PAD_B;                                          // 原點像素 y
const px = x => ox + x * cell;
const py = y => oy - y * cell;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ccc"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff"; ctx.fillRect(px(0), py(BOARD_H), cell * BOARD_W, cell * BOARD_H);
  ctx.strokeStyle = "#555"; ctx.lineWidth = 1;
  for (let i = 0; i <= BOARD_W; i++) { ctx.beginPath(); ctx.moveTo(px(i), py(0)); ctx.lineTo(px(i), py(BOARD_H)); ctx.stroke(); }
  for (let j = 0; j <= BOARD_H; j++) { ctx.beginPath(); ctx.moveTo(px(0), py(j)); ctx.lineTo(px(BOARD_W), py(j)); ctx.stroke(); }
  ctx.fillStyle = "#000"; ctx.font = "13px sans-serif";
  ctx.textAlign = "center";
  for (let i = 0; i <= BOARD_W; i++) ctx.fillText(i, px(i), py(0) + 18);
  ctx.textAlign = "right";
  for (let j = 0; j <= BOARD_H; j++) ctx.fillText(j, px(0) - 8, py(j) + 4);
  ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("+Y", ox + cell * BOARD_W / 2, 28);
  ctx.fillText("-Y", ox + cell * BOARD_W / 2, canvas.height - 16);
  ctx.textAlign = "left";  ctx.fillText("+X", px(BOARD_W) + 8, py(BOARD_H / 2));
  ctx.textAlign = "right"; ctx.fillText("-X", px(0) - 28, py(BOARD_H / 2));
}

function arrow(x1, y1, x2, y2, color) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), h = 12;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - h * Math.cos(a - 0.4), y2 - h * Math.sin(a - 0.4));
  ctx.lineTo(x2 - h * Math.cos(a + 0.4), y2 - h * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill();
}

function drawObject(x, y, dir) {
  // 物件：左下角（最靠近原點的角點）在 (x, y)
  ctx.fillStyle = "#1a1aff";
  ctx.fillRect(px(x), py(y + OBJ_SIZE), cell * OBJ_SIZE, cell * OBJ_SIZE);

  // 基準角點
  ctx.fillStyle = "red";
  ctx.beginPath(); ctx.arc(px(x), py(y), 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#000"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(`(${x}, ${y})`, px(x) + 8, py(y) + 22);

  // 深孔朝向箭頭（從物件外側指向深孔面）
  const cx = px(x + OBJ_SIZE / 2), cy = py(y + OBJ_SIZE / 2), half = cell * OBJ_SIZE / 2, len = cell * 2.2;
  const v = { "+X": [1, 0], "-X": [-1, 0], "+Y": [0, -1], "-Y": [0, 1] }[dir];
  const ex = cx + v[0] * half, ey = cy + v[1] * half;
  arrow(ex + v[0] * len, ey + v[1] * len, ex, ey, "red");
  // 深孔標記
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#000"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("深孔", ex + v[0] * (len + 22), ey + v[1] * (len + 14) + 5);
}

function draw() {
  const x = randInt(0, X_MAX), y = randInt(0, Y_MAX), dir = DIRS[randInt(0, 3)];
  drawBoard(); drawObject(x, y, dir);
  document.getElementById("result").innerHTML =
    `座標 <b>(${x}, ${y})</b>　深孔朝向 <b>${dir}</b>`;
}

drawBoard();
document.getElementById("drawBtn").addEventListener("click", draw);
</script>
</body>
</html>
